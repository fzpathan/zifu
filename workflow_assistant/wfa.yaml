    version: "1.0"

    # ============================================================
    # Workflow Definitions for Workflow Assistant
    #
    # Each workflow is a deterministic pipeline the backend executes
    # after the LLM classifies user intent and extracts parameters.
    # The LLM is used ONLY for: intent classification, param
    # extraction, and step result summarization.
    # ============================================================

    workflows:

      # ────────────────────────────────────────────────────────
      - id: transform_validation
        name: "Transform Validation"
        description: "Build and test a data transform on sample rows or a data file — from plain English, explicit operation settings, or partial formula JSON. Does not modify config Excel sheets or run controls."
        icon: "⚙️"

        intent_classification:
          use_when: "User wants to build, test, or validate a transform/formula on sample data (inline, LLM-generated, or read from a data file)."
          not_when: "User mentions config Excel validation, FieldOperations sheet rows, fixing config errors, searching deployed parquet configs, or running a control."
          examples:
            - "create a formula to extract year from transaction_date"
            - "run a transform on my sample data"
            - "test a DateExtract on transaction_date"
            - "build a concatenate formula for first_name and last_name"
            - "test conditional logic on my data"
            - "check if my formula works on sample data"
            - "generate a transform to map status codes to labels"
            - "run a string operation on this column"
            - "read my csv file and apply a transform"
            - "test this partial formula json on sample rows"
            - "execute a SetValue transform on sample data"
          negative_examples:
            - "validate my QA config file"
            - "add a row to FieldOperations"
            - "search config for account_id"
            - "update config and run the control"
            - "validate and fix my config errors"
            - "analyse row 5 in field operations"
          keywords:
            - test transform
            - run transform
            - test formula
            - build formula
            - create formula
            - generate formula
            - transform sample
            - test operation
            - execute transform on data
            - test on sample data
            - partial formula json

        params:
          - key: input_format
            label: "Input Mode"
            type: select
            required: false
            options:
              - generated
              - explicit
              - formula_json
            description: "generated — plain-English description (LLM builds the rule). explicit — you supply operation_type and fields. formula_json — partial JSON config for the LLM to complete."
            example: "generated"

          - key: formula_description
            label: "Formula Description or Partial JSON"
            type: textarea
            required: false
            description: "Plain-English transformation description, or partial formula JSON when input_format=formula_json. Required unless explicit operation fields are provided."
            example: "Extract the year from transaction_date and store it in extracted_year"

          - key: operation_type
            label: "Operation Type"
            type: select
            required: false
            options:
              - DateExtract
              - Concatenate
              - Formula
              - Conditional
              - MapValues
              - StringOperation
              - NumericOperation
              - SetValue
              - CopyField
              - Split
              - Replace
            description: "The transform operation to execute"
            example: "DateExtract"

          - key: new_field_name
            label: "New Field Name"
            type: text
            required: false
            description: "Output column that will be created or updated by the operation (required for explicit mode)"
            example: "extracted_year"

          - key: input_fields
            label: "Input Fields (comma-separated)"
            type: text
            required: false
            description: "Source column(s) used as input for the operation (required for explicit mode)"
            example: "transaction_date"

          - key: operation_params
            label: "Operation Parameters (JSON)"
            type: textarea
            required: false
            description: "Additional operation-specific options as JSON (e.g. component, separator, mapping)"
            example: '{"component": "year"}'

          - key: input_file_path
            label: "Input File Path (optional)"
            type: text
            required: false
            description: "Absolute path to an Excel (.xlsx) or CSV (.csv) file to read sample data from. If provided, overrides Sample Data below."
            example: "/opt/data/transactions.xlsx"

          - key: sheet_name
            label: "Excel Sheet Name (optional)"
            type: text
            required: false
            description: "Sheet name to read from the Excel file (leave blank for the first sheet)"
            example: "Sheet1"

          - key: sample_data
            label: "Sample Data (JSON array)"
            type: textarea
            required: false
            description: "Array of row objects to transform. Not needed if Input File Path is provided."
            example: '[{"id": 1, "transaction_date": "2024-03-15", "amount": 500}]'

          - key: dataset_name
            label: "Dataset Name(s) (optional)"
            type: text
            required: false
            description: "One or more dataset names for FieldOperations output (comma, semicolon, or pipe separated, e.g. SRC,TGT). When provided, the output file is written as one config row per dataset name with the same formula."
            example: "SRC,TGT"

          - key: output_write_mode
            label: "Output Write Mode (optional)"
            type: select
            required: false
            options:
              - auto
              - results
              - field_operations
            description: "auto — write FieldOperations rows when dataset_name is set, otherwise write transform result rows. results — always write transformed sample data. field_operations — always write FieldOperations config row(s)."
            example: "auto"

          - key: output_file_path
            label: "Output File Path (optional)"
            type: text
            required: false
            description: "Absolute path to write output (.xlsx or .csv). With dataset_name set, writes one FieldOperations row per dataset; otherwise writes transformed sample rows."
            example: "/opt/data/transform_field_ops.xlsx"

        steps:
          - id: read_input_file
            name: "Read Input File"
            function_type: file_read
            description: "Reads sample data from an Excel or CSV file. Skipped if no input file path is provided."

          - id: build_formula
            name: "Generate Formula Config"
            function_type: llm_build_formula
            description: "LLM generates operation_type, field names, operation_params, and test data from the description or partial JSON"
            condition: "input_format != 'explicit'"

          - id: execute_transform
            name: "Execute Transform Operation"
            function_type: transform_execute
            description: "Applies the operation to sample data — uses LLM-built config when input_format is not explicit"

          - id: write_output_file
            name: "Write Results to File"
            function_type: file_write
            write_mode: auto
            description: "Writes transform result rows or FieldOperations config row(s) to Excel/CSV. Multiple dataset_name values produce one row per dataset. Skipped if no output path is provided."

          - id: summarize
            name: "Summarize Results"
            function_type: llm_summarize
            description: "Interprets the transformed data and presents a clear summary"
            prompt_template: >
              Input mode: {{input_format}}
              User request: {{formula_description}}

              Generated formula config (blank if explicit mode):
              {{build_formula.result}}

              Operation used: {{operation_type}} on field(s) "{{input_fields}}".
              Output field: "{{new_field_name}}".
              Operation parameters: {{operation_params}}.
              Dataset name(s): {{dataset_name}}

              Transformed results (JSON):
              {{execute_transform.result}}

              File output: {{write_output_file.result}}

              Please:
              1. If a formula was generated, show the config in a JSON code block
              2. Show key before/after values in a markdown table
              3. Confirm whether the operation worked as expected
              4. Highlight any unexpected nulls, errors, or data type issues
              5. If results were written to a file, confirm the output path, write mode, and row count
              6. If FieldOperations rows were written, confirm one row was created per dataset name

      # ────────────────────────────────────────────────────────
      - id: config_validation
        name: "Config File Validation"
        description: "Validate an Excel config file (QA or COMP control type) and report errors by sheet. Optionally write the validation summary to a file."
        icon: "✅"

        intent_classification:
          use_when: "User wants to validate a config Excel file and get an error report only — no fixes applied."
          not_when: "User asks to fix, apply, repair, or apply corrections. User wants to search parquet configs or test transforms."
          examples:
            - "validate my config file"
            - "check my completeness config for errors"
            - "run validation on my QA config"
            - "validate the config at /opt/configs/qa.xlsx"
            - "check my COMP config file"
            - "run config validator"
            - "validate my excel config for QA"
            - "is my config file correct for completeness"
            - "run validation on completeness config"
            - "check for errors in my config excel"
            - "validate and save the report"
          negative_examples:
            - "validate and fix the errors"
            - "apply fixes to my config"
            - "repair my QA config"
            - "search config for account_id"
            - "test a transform on sample data"
          keywords:
            - validate config
            - config validation
            - check config errors
            - config validator
            - validate excel config
            - check config file
            - validate completeness config
            - validate quality config
            - run config validation
            - config error report

        params:
          - key: file_path
            label: "Config File Path"
            type: text
            required: true
            description: "Absolute path to the Excel config file (.xlsx or .xls) on the server"
            example: "/opt/configs/completeness_config.xlsx"

          - key: control_type
            label: "Control Type"
            type: select
            required: true
            options:
              - QA
              - COMP
            description: "QA for Quality Assurance checks, COMP for Completeness reconciliation"
            example: "QA"

          - key: summary_output_path
            label: "Save Summary To (optional)"
            type: text
            required: false
            description: "Absolute path to write the validation summary report (.txt, .md, or .xlsx). Leave blank to skip."
            example: "/opt/reports/qa_validation_report.txt"

        steps:
          - id: start_validation
            name: "Start Config Validation"
            function_type: config_validate_start
            description: "Triggers the config validation subprocess and returns a task ID"

          - id: poll_status
            name: "Wait for Validation to Complete"
            function_type: poll_until
            description: "Polls the task status until validation finishes or fails"
            poll_config:
              interval_seconds: 3
              max_attempts: 40
              done_statuses:
                - completed
                - failed
                - error
                - not_found

          - id: summarize
            name: "Summarize Validation Report"
            function_type: llm_summarize
            description: "Formats the validation output into a clear error report with fix suggestions"
            prompt_template: >
              A config file validation was run on "{{file_path}}" (control type: {{control_type}}).
              Validation result:
              {{poll_status.result}}

              Please produce a concise markdown report:
              1. Overall verdict: PASS or FAIL
              2. List any validation errors grouped by config sheet (if present)
              3. For each error, suggest the most likely fix
              4. If validation passed, confirm all sheets are clean

          - id: write_summary
            name: "Write Summary to File"
            function_type: file_write_summary
            description: "Saves the validation summary report to a file. Skipped if no output path is provided."

      # ────────────────────────────────────────────────────────
      - id: config_validation_fix
        name: "Config Validation & Fix"
        description: "Find a config Excel file by full path or partial name, run validation, fetch detailed results, get structured LLM fix suggestions per sheet/row/column, and optionally apply those fixes back to the workbook."
        icon: "🔧"

        intent_classification:
          use_when: "User explicitly asks to fix, apply, repair, or apply corrections after config validation."
          not_when: "User only wants a validation report. User wants to run a control or edit FieldOperations formulas without fix language."
          examples:
            - "validate my config and fix the errors"
            - "validate and apply suggestions to my QA config"
            - "find my completeness config and fix validation errors"
            - "validate qa_config.xlsx and suggest fixes"
            - "run validation on my COMP config and apply the fixes"
            - "find and validate my config then fix it"
            - "validate the config file and write corrections back"
            - "check my config for errors and fix them automatically"
            - "validate and repair my QA excel config"
            - "apply corrections to my config workbook"
          negative_examples:
            - "validate my config file"
            - "check config for errors"
            - "run config validator"
            - "update config and run the control"
            - "test a transform formula"
          keywords:
            - validate and fix
            - fix config
            - apply fixes
            - repair config
            - fix validation errors
            - apply suggestions
            - validate and repair
            - apply corrections
            - fix and save config
            - auto fix config
            - write corrections back

        params:
          - key: file_input
            label: "Config File Path or Name"
            type: text
            required: true
            description: "Full absolute path to the Excel file, or a partial file name / glob pattern. If a partial name is given the backend globs the configured workspace to find the best match."
            example: "qa_config.xlsx"

          - key: search_root
            label: "Search Root Directory (optional)"
            type: text
            required: false
            description: "Directory to glob-search when file_input is a partial name. Leave blank to use the default secure workspace root."
            example: "/opt/configs"

          - key: control_type
            label: "Control Type"
            type: select
            required: true
            options:
              - QA
              - COMP
            description: "QA for Quality Assurance checks, COMP for Completeness reconciliation"
            example: "QA"

          - key: apply_fixes
            label: "Apply Suggested Fixes?"
            type: select
            required: false
            options:
              - "no"
              - "yes"
            description: "Set to yes to write the LLM-suggested cell corrections back to the workbook. The original file is backed up before changes are applied."
            example: "no"

          - key: summary_output_path
            label: "Save Report To (optional)"
            type: text
            required: false
            description: "Absolute path to write the final validation and fix report (.txt, .md, or .xlsx). Leave blank to skip."
            example: "/opt/reports/qa_fix_report.txt"

        steps:
          - id: locate_config_file
            name: "Find Config Workbook"
            function_type: locate_excel_file_glob
            description: "If file_input is an absolute path, verifies the file exists. If it is a partial name or glob pattern, searches the workspace (or search_root) and returns the best matching .xlsx path. Raises an error if no match or multiple ambiguous matches are found."

          - id: start_validation
            name: "Start Config Validation"
            function_type: config_validate_start
            file_step_id: locate_config_file
            description: "Calls POST /api/config-validator/validate with the resolved file path and control_type. Returns a task_id."

          - id: poll_status
            name: "Wait for Validation to Complete"
            function_type: poll_until
            description: "Polls GET /api/config-validator/{task_id}/status until the task reaches a terminal state"
            poll_config:
              interval_seconds: 3
              max_attempts: 40
              done_statuses:
                - completed
                - failed
                - error
                - not_found

          - id: fetch_results
            name: "Fetch Detailed Validation Results"
            function_type: fetch_validation_results
            task_step_id: start_validation
            description: "Calls GET /api/config-validator/{task_id}/results to retrieve the full structured results JSON including per-sheet errors, row numbers, and column details"

          - id: analyse_suggestions
            name: "Analyse Errors & Generate Fix Suggestions"
            function_type: llm_analyse_suggestions
            description: "LLM receives the detailed results JSON and produces a structured fix list — each item includes sheet, row, column, current_value, suggested_value, and reason"
            prompt_template: >
              A config file validation was run on the file below (control type: {{control_type}}).

              Resolved file path:
              {{locate_config_file.result}}

              Detailed validation results:
              {{fetch_results.result}}

              Your task:
              1. Identify every validation error in the results
              2. For each error produce a fix suggestion as a JSON object with these exact keys:
                - sheet: the sheet name where the error is
                - row: the 1-based data row number (not including the header row)
                - column: the column name
                - current_value: what is currently in that cell (null if empty)
                - suggested_value: the corrected value to write
                - reason: one-sentence explanation of why this fix is correct
              3. Return your response as a JSON object with two keys:
                - "fix_list": the array of fix suggestion objects above
                - "summary": a markdown string with overall verdict (PASS/FAIL), error count by sheet, and a brief explanation of each fix

          - id: apply_config_fixes
            name: "Apply Fixes to Workbook"
            function_type: apply_config_fixes
            file_step_id: locate_config_file
            suggestions_step_id: analyse_suggestions
            description: "If apply_fixes is yes, backs up the original workbook then writes each suggested cell correction back using openpyxl. Skipped when apply_fixes is no."
            condition: "apply_fixes == 'yes'"

          - id: write_report
            name: "Write Report to File"
            function_type: file_write_summary
            description: "Saves the fix report to a file. Skipped if no summary_output_path is provided."

          - id: summarize
            name: "Summarise Validation & Fixes"
            function_type: llm_summarize
            description: "Produces the final user-facing report combining validation outcome, suggestions, and fix application result"
            prompt_template: >
              Config validation and fix workflow completed.

              Resolved file:
              {{locate_config_file.result}}

              Detailed validation results:
              {{fetch_results.result}}

              LLM fix suggestions (structured):
              {{analyse_suggestions.result}}

              Fix application result (blank if apply_fixes=no):
              {{apply_config_fixes.result}}

              Please produce a final markdown report:
              1. Overall verdict: PASS or FAIL with total error count
              2. Per-sheet breakdown of errors found
              3. For each error: show the fix suggestion in a table (sheet, row, column, current → suggested, reason)
              4. If apply_fixes=yes: confirm which cells were updated, the backup file path, and any cells that could not be written
              5. If apply_fixes=no: remind the user they can re-run with apply_fixes=yes to apply the corrections
              6. Flag any errors that could not be auto-fixed and require manual intervention

      # ────────────────────────────────────────────────────────
      - id: config_search
        name: "Config Search"
        description: "Search across config data files (rules, enrichment, field ops, etc.) by keyword or field name."
        icon: "🔍"

        intent_classification:
          use_when: "User wants to search deployed parquet/indexed config data for a field, rule, or keyword."
          not_when: "User wants to validate or fix an Excel config file, test transforms, or edit a FieldOperations row."
          examples:
            - "search config for account_id field"
            - "find rules that use customer_name"
            - "look up enrichment config for product_code"
            - "search the config for output rules containing status"
            - "find field operations for date_of_birth"
            - "config search for region mapping"
            - "where is account_number configured"
            - "find all rules referencing balance"
            - "search config files for transaction_type"
            - "look up the field mapping for currency"
          negative_examples:
            - "validate my config file"
            - "add a row to FieldOperations"
            - "test a transform on sample data"
            - "validate and fix config errors"
          keywords:
            - config search
            - search config
            - find in config
            - look up config
            - search rules
            - find rule
            - enrichment search
            - where is configured
            - find field in config
            - search parquet config

        params:
          - key: query
            label: "Search Query"
            type: text
            required: true
            description: "Keyword or field name to search for across config files"
            example: "account_id"

          - key: sheet
            label: "Config Sheet (optional)"
            type: select
            required: false
            options:
              - InputFiles
              - rules
              - Enrichment
              - FieldOperations
              - OutputRule
            description: "Limit the search to one specific sheet (leave empty to search all)"
            example: "rules"

          - key: control_type
            label: "Control Type (optional)"
            type: select
            required: false
            options:
              - QA
              - COMP
            description: "Filter by control type — leave empty to search all types"
            example: "QA"

        steps:
          - id: run_search
            name: "Search Config Files"
            function_type: config_search
            description: "Runs a regex search across matching parquet config files"

          - id: summarize
            name: "Summarize Search Results"
            function_type: llm_summarize
            description: "Formats the search hits into a readable summary with context"
            prompt_template: >
              The user searched config files for "{{query}}"
              (sheet filter: {{sheet}}, control_type: {{control_type}}).
              Search results:
              {{run_search.result}}

              Please:
              1. Show matching rows in a markdown table with the most relevant columns
              2. Note which config types and sheets contain matches
              3. Briefly explain the context of each match (what the field/rule is used for)
              4. If no results found, suggest alternative search terms or spellings

      # ────────────────────────────────────────────────────────
      - id: input_files
        name: "Input Files Setup & Profile"
        description: "Build InputFiles config row(s) from schema, generate a file regex, search the data directory, profile the matched file, and summarise. Supports multiple dataset names (one row per dataset)."
        icon: "📁"

        intent_classification:
          use_when: "User wants to configure, search, or profile an InputFiles entry — dataset name, file directory, file type, date format/selection, skip rows."
          not_when: "User wants transform validation, config validation, FieldOperations formulas, parquet config search, or running a control."
          examples:
            - "add an input file for dataset SRC in /opt/data/inbound"
            - "configure input files for transactions CSV with date format YYYYMMDD"
            - "profile the input file for dataset TGT"
            - "create input files row for trades_YYYYMMDD.csv in /opt/feeds"
            - "search for the latest transaction file and profile it"
            - "set up InputFiles for SRC and TGT datasets"
            - "generate regex for input file pattern and profile the file"
          negative_examples:
            - "test a transform on sample data"
            - "validate my config file"
            - "search config for account_id"
            - "add a row to FieldOperations"
            - "update config and run the control"
          keywords:
            - input files
            - inputfiles
            - configure input file
            - profile input file
            - file directory
            - file date format
            - dataset input file
            - search input file
            - input file regex
            - skip top row

        params:
          - key: config_path
            label: "Config Excel Path"
            type: text
            required: true
            description: "Absolute path to the control config workbook (.xlsx) containing the InputFiles sheet."
            example: "/opt/configs/qa_config.xlsx"

          - key: sheet_name
            label: "Config Sheet Name"
            type: text
            required: false
            description: "Sheet to read schema samples from. Defaults to InputFiles."
            example: "InputFiles"

          - key: dataset_name
            label: "Dataset Name(s)"
            type: text
            required: true
            description: "One or more dataset names (comma, semicolon, or pipe separated). Writes one InputFiles row per dataset."
            example: "SRC,TGT"

          - key: file_name
            label: "File Name / Pattern"
            type: text
            required: true
            description: "Expected file name or pattern (may include date tokens like YYYYMMDD)."
            example: "transactions_YYYYMMDD.csv"

          - key: file_directory
            label: "File Directory"
            type: text
            required: true
            description: "Directory on the server where input files are located."
            example: "/opt/data/inbound/transactions"

          - key: file_type
            label: "File Type"
            type: select
            required: true
            options:
              - CSV
              - XLSX
              - XLS
              - TXT
              - PARQUET
              - ZIP
            description: "Physical file format."
            example: "CSV"

          - key: file_date_format
            label: "File Date Format"
            type: text
            required: true
            description: "Date format token in the file name (e.g. %Y%m%d, yyyyMMdd, DD-MM-YYYY)."
            example: "%Y%m%d"

          - key: file_date_selection
            label: "File Date Selection"
            type: select
            required: true
            options:
              - LATEST
              - EXACT
              - OFFSET
              - RANGE
            description: "How to select among multiple dated files in the directory."
            example: "LATEST"

          - key: skip_top_row
            label: "Skip Top Rows (optional)"
            type: text
            required: false
            description: "Rows to skip after the header when profiling the data file."
            example: "0"

          - key: skip_bottom_row
            label: "Skip Bottom Rows (optional)"
            type: text
            required: false
            description: "Rows to skip from the bottom when profiling the data file."
            example: "0"

          - key: input_files_description
            label: "Additional Notes (optional)"
            type: textarea
            required: false
            description: "Extra context for regex/row generation (encoding, delimiter, zip contents, etc.)."
            example: "Files arrive daily; use the latest file by modified time when LATEST is selected."

          - key: output_file_path
            label: "Write Rows To (optional)"
            type: text
            required: false
            description: "Absolute path to write generated InputFiles row(s) as Excel or CSV."
            example: "/opt/configs/input_files_draft.xlsx"

        steps:
          - id: locate_config
            name: "Locate Config Workbook"
            function_type: locate_excel_file
            description: "Verifies the config Excel path exists and resolves the InputFiles sheet."

          - id: read_sheet_structure
            name: "Read InputFiles Sheet Schema"
            function_type: read_excel_sheet_structure
            description: "Reads column headers and sample rows from the InputFiles sheet for LLM alignment."

          - id: build_input_files_config
            name: "Build InputFiles Rows & File Regex"
            function_type: llm_build_input_files
            description: "LLM validates parameters against schema, generates file_regex, and produces one row per dataset name."

          - id: search_data_file
            name: "Search for Data File"
            function_type: search_data_file
            description: "Searches file_directory using the generated regex. TODO — replace with inbuilt search function."

          - id: profile_data_file
            name: "Profile Matched File"
            function_type: profile_data_file
            description: "Profiles the selected file — columns, nulls, samples, row count — honouring skip top/bottom rows."

          - id: write_input_files_rows
            name: "Write InputFiles Rows to File"
            function_type: write_input_files_rows
            description: "Writes generated InputFiles row(s) to Excel/CSV. Skipped if no output path."

          - id: summarize
            name: "Summarise Input Files Setup"
            function_type: llm_summarize
            description: "Summarises the InputFiles config, search match, and profile results."
            prompt_template: >
              Config workbook: {{config_path}}
              Dataset name(s): {{dataset_name}}
              File name pattern: {{file_name}}
              File directory: {{file_directory}}
              File type: {{file_type}}
              File date format: {{file_date_format}}
              File date selection: {{file_date_selection}}
              Skip top row: {{skip_top_row}}
              Skip bottom row: {{skip_bottom_row}}

              InputFiles sheet structure:
              {{read_sheet_structure.result}}

              Generated InputFiles config and regex:
              {{build_input_files_config.result}}

              File search results:
              {{search_data_file.result}}

              File profile:
              {{profile_data_file.result}}

              Rows written to file:
              {{write_input_files_rows.result}}

              Please:
              1. Show the generated InputFiles row(s) in a markdown table (one row per dataset)
              2. Show the file_regex pattern and explain what files it matches
              3. Summarise the search result — which file was selected and how many matches were found
              4. Present key profile stats: row count, columns, null highlights, sample values
              5. Note any TODO items (inbuilt search, date selection logic) still pending
              6. If rows were written to a file, confirm path and row count

      # ────────────────────────────────────────────────────────
      - id: field_mapping_analyser
        name: "Field Mapping Formula Analyser & Row Builder"
        description: "Analyse an existing FieldOperations row (look up by name or row number, improve it, test it, optionally rewrite it) — OR build a brand-new row from a description or formula JSON, validate it through the transform engine, and append it to the sheet."
        icon: "📋"

        intent_classification:
          use_when: "User wants to read, analyse, improve, append, or update a FieldOperations row in a config Excel workbook."
          not_when: "User wants a standalone transform test without a config workbook, config validation only, parquet config search, or running a control."
          examples:
            - "read row 5 from field operations"
            - "analyse the formula for extracted_year in field mapping"
            - "look up the field operations formula for risk_score"
            - "check the field mapping formula at row 12"
            - "analyse and improve the formula for customer_id"
            - "what does the formula for status_label do"
            - "add a new formula to field operations in qa_config.xlsx"
            - "append a new row to the FieldOperations sheet"
            - "insert a new field mapping for extracted_year"
            - "add this formula json to the fieldoperations sheet"
          negative_examples:
            - "test a transform on sample data"
            - "search config for account_id"
            - "validate my config file"
            - "update config and run the control"
            - "create a formula to extract year from date"
          keywords:
            - field operations
            - field mapping
            - fieldoperations row
            - fieldoperations sheet
            - analyse formula row
            - read fieldoperations row
            - append fieldoperations
            - add row fieldoperations
            - insert field mapping
            - lookup fieldoperations formula
            - improve field mapping formula

        params:
          - key: action
            label: "Action"
            type: select
            required: true
            options:
              - analyse
              - add_new
            description: "analyse — look up and inspect an existing row, optionally rewrite it. add_new — build a new row from a description or formula JSON and append it to the sheet."
            example: "analyse"

          - key: file_path
            label: "Config Excel File Path"
            type: text
            required: true
            description: "Absolute path to the user's Excel config file inside the secure workflow workspace"
            example: "/opt/configs/qa_config.xlsx"

          - key: sheet_name
            label: "Sheet Name"
            type: text
            required: false
            description: "Excel sheet to read and optionally update. Defaults to FieldOperations."
            example: "FieldOperations"

          - key: lookup_type
            label: "Look Up By (analyse only)"
            type: select
            required: false
            options:
              - new_field_name
              - row_number
            description: "Used when action=analyse. Find the row by its output field name or by its row number in the sheet."
            example: "new_field_name"

          - key: lookup_value
            label: "Field Name or Row Number (analyse only)"
            type: text
            required: false
            description: "Used when action=analyse. The NewFieldName value (e.g. extracted_year) or row number (e.g. 5)."
            example: "extracted_year"

          - key: control_type
            label: "Control Type (optional)"
            type: select
            required: false
            options:
              - QA
              - COMP
            description: "Filter to a specific control type — leave blank to search all"
            example: "QA"

          - key: sample_data
            label: "Sample Data (optional JSON array)"
            type: textarea
            required: false
            description: "Test rows to run against the formula. Leave blank for LLM-generated test data."
            example: '[{"trade_date": "2024-01-15", "amount": 200.5}]'

          - key: apply_changes
            label: "Rewrite Workbook Row? (analyse only)"
            type: select
            required: false
            options:
              - "no"
              - "yes"
            description: "Used when action=analyse. Set to yes to write the improved formula back to the same row."
            example: "no"

          - key: formula_input
            label: "Formula Input (add_new only)"
            type: textarea
            required: false
            description: "Used when action=add_new. Either a plain-English description of the transformation, or a partial/complete formula JSON config. Interpreted according to Input Format below."
            example: "Extract the year from trade_date and store it in extracted_year"

          - key: input_format
            label: "Input Format (add_new only)"
            type: select
            required: false
            options:
              - description
              - formula_json
            description: "Used when action=add_new. description — the LLM generates the row from plain English. formula_json — the LLM validates and fills missing columns from the provided JSON."
            example: "description"

        steps:
          - id: locate_config_file
            name: "Locate Secure Config Workbook"
            function_type: locate_excel_file
            description: "Resolves and verifies the user-supplied Excel file path against the configured secure workspace. Runs for both actions."

          - id: read_sheet_structure
            name: "Read Sheet Column Structure"
            function_type: read_excel_sheet_structure
            description: "Reads the column headers and last 3 rows of the target sheet to capture its schema. Runs only when action=add_new."
            condition: "action == 'add_new'"

          - id: read_field_mapping
            name: "Read FieldOperations Row"
            function_type: read_excel_config_row
            sheet: FieldOperations
            description: "Reads the requested row from the selected Excel sheet by row number or NewFieldName/OutputField. Runs only when action=analyse."
            condition: "action == 'analyse'"

          - id: analyse_formula
            name: "Understand, Improve & Generate Tests"
            function_type: llm_build_formula_from_row
            source_step_id: read_field_mapping
            description: "LLM reads the existing row, understands the transform, proposes a corrected config if needed, and creates test rows. Runs only when action=analyse."
            condition: "action == 'analyse'"

          - id: build_row
            name: "Build New Row from Input"
            function_type: llm_build_row_for_sheet
            structure_step_id: read_sheet_structure
            description: "LLM receives the sheet column schema plus formula_input and input_format, then returns a complete row dict aligned to the actual columns with generated test data. Runs only when action=add_new."
            condition: "action == 'add_new'"

          - id: execute_transform
            name: "Validate Candidate Formula"
            function_type: transform_execute_from_prior
            formula_step_id: analyse_formula
            build_step_id: build_row
            description: "Runs the generated candidate formula and test cases through the transform engine. Uses analyse_formula result when action=analyse, build_row result when action=add_new."

          - id: rewrite_field_mapping
            name: "Optionally Rewrite Original Row"
            function_type: rewrite_excel_config_row
            row_step_id: read_field_mapping
            formula_step_id: analyse_formula
            validator_step_id: execute_transform
            description: "If apply_changes is yes and there are changes, writes the candidate formula back to the same workbook row. Runs only when action=analyse."
            condition: "action == 'analyse'"

          - id: append_excel_row
            name: "Append New Row to Sheet"
            function_type: append_excel_row
            row_step_id: build_row
            validator_step_id: execute_transform
            description: "Appends the validated new row dict to the end of the target sheet. Runs only when action=add_new."
            condition: "action == 'add_new'"

          - id: summarize
            name: "Summarise Result"
            function_type: llm_summarize
            description: "Explains the formula, improvements or new row details, and test results"
            prompt_template: >
              Action taken: {{action}}

              Workbook lookup:
              {{locate_config_file.result}}

              --- ANALYSE MODE (ignore if action=add_new) ---

              Original row from config sheet:
              {{read_field_mapping.result}}

              Candidate formula config and generated test cases:
              {{analyse_formula.result}}

              Transform validator results:
              {{execute_transform.result}}

              Workbook rewrite result:
              {{rewrite_field_mapping.result}}

              --- ADD NEW MODE (ignore if action=analyse) ---

              Sheet column structure:
              {{read_sheet_structure.result}}

              Built row config and generated test cases:
              {{build_row.result}}

              Transform validator results:
              {{execute_transform.result}}

              Append result:
              {{append_excel_row.result}}

              ---

              If action=analyse, please:
              1. Show the original formula row as a table
              2. Explain in plain English what the formula does
              3. Show the candidate formula config in a JSON code block and note any changes versus the original row
              4. Show the generated test cases and before/after validator results
              5. State whether the Excel workbook was modified, including file path, sheet, row number, and changed columns when applicable
              6. Flag any issues found in the original or edge cases to watch

              If action=add_new, please:
              1. Show the sheet column structure that was detected
              2. Show the generated row dict in a JSON code block, with each column clearly labelled
              3. Show the generated test cases and before/after validator results
              4. Confirm the row was appended successfully, including file path, sheet name, and the row number it was written to
              5. Flag any columns that were left blank or defaulted, and any edge cases to watch

      # ────────────────────────────────────────────────────────
      - id: config_update_and_run
        name: "Config Update & Control Run"
        description: "Read a config sheet, build or update a FieldOperations formula, test it through the transform engine, write it back to the workbook, run the control in UAT with yesterday's date, wait for completion, fetch results, and summarise the full end-to-end outcome."
        icon: "🚀"

        intent_classification:
          use_when: "User wants to change a FieldOperations formula in a config workbook AND run/execute a control afterwards."
          not_when: "User does not mention running or executing a control. Use field_mapping_analyser for sheet edits only."
          examples:
            - "update config and run the control"
            - "add a formula to config then run control my_qa_control"
            - "change FieldOperations and execute the control"
            - "update field operations formula for risk_score then run"
            - "modify config formula and run the control in UAT"
            - "add new formula to config and run control"
            - "update existing formula in config and trigger control run"
            - "apply formula update to config and execute control"
          negative_examples:
            - "add a row to FieldOperations"
            - "analyse row 5 in field operations"
            - "validate my config file"
            - "test a transform on sample data"
            - "search config for account_id"
          keywords:
            - run control
            - execute control
            - trigger control
            - update config and run
            - config change and run
            - apply and run control
            - run control after update
            - update formula and run
            - modify config run control

        params:
          - key: file_input
            label: "Config File Path or Name"
            type: text
            required: true
            description: "Full absolute path or partial file name to glob-search for the config workbook"
            example: "qa_config.xlsx"

          - key: control_id
            label: "Control ID"
            type: text
            required: true
            description: "The control identifier to run after the config is updated (matches an entry in control_ids.json)"
            example: "my_qa_control"

          - key: change_action
            label: "Change Type"
            type: select
            required: true
            options:
              - add_new
              - update_existing
            description: "add_new — append a brand-new row. update_existing — find and improve an existing row."
            example: "add_new"

          - key: sheet_name
            label: "Sheet Name"
            type: text
            required: false
            description: "Excel sheet to modify. Defaults to FieldOperations."
            example: "FieldOperations"

          - key: formula_input
            label: "Formula Description or JSON"
            type: textarea
            required: true
            description: "Plain-English description of the formula change, or a partial formula JSON config"
            example: "Extract the month from trade_date and store it in trade_month"

          - key: input_format
            label: "Input Format"
            type: select
            required: false
            options:
              - description
              - formula_json
            description: "description — LLM generates the row from plain English. formula_json — LLM fills missing columns from the provided JSON."
            example: "description"

          - key: lookup_type
            label: "Look Up By (update_existing only)"
            type: select
            required: false
            options:
              - new_field_name
              - row_number
            description: "Used when change_action=update_existing. Find the row by field name or row number."
            example: "new_field_name"

          - key: lookup_value
            label: "Field Name or Row Number (update_existing only)"
            type: text
            required: false
            description: "Used when change_action=update_existing. The NewFieldName value or 1-based row number."
            example: "extracted_year"

        steps:
          - id: locate_config_file
            name: "Find Config Workbook"
            function_type: locate_excel_file_glob
            description: "Resolves the config file by full path or glob search across the secure workspace"

          - id: read_sheet_structure
            name: "Read Sheet Column Structure"
            function_type: read_excel_sheet_structure
            description: "Reads column headers and last 3 rows from the target sheet to capture its schema. Runs only when change_action=add_new."
            condition: "change_action == 'add_new'"

          - id: read_field_mapping
            name: "Read Existing Row"
            function_type: read_excel_config_row
            sheet: FieldOperations
            description: "Reads the existing row by field name or row number. Runs only when change_action=update_existing."
            condition: "change_action == 'update_existing'"

          - id: build_new_row
            name: "Build New Row from Input"
            function_type: llm_build_row_for_sheet
            structure_step_id: read_sheet_structure
            description: "LLM generates a complete row dict aligned to the sheet schema. Runs only when change_action=add_new."
            condition: "change_action == 'add_new'"

          - id: analyse_formula
            name: "Analyse & Improve Existing Row"
            function_type: llm_build_formula_from_row
            source_step_id: read_field_mapping
            description: "LLM reads the existing row, understands the transform, and generates an improved formula config. Runs only when change_action=update_existing."
            condition: "change_action == 'update_existing'"

          - id: execute_transform
            name: "Test Formula"
            function_type: transform_execute_from_prior
            formula_step_id: analyse_formula
            build_step_id: build_new_row
            description: "Runs the generated formula through the transform engine. Uses build_new_row when add_new, analyse_formula when update_existing."

          - id: append_excel_row
            name: "Append New Row to Sheet"
            function_type: append_excel_row
            row_step_id: build_new_row
            validator_step_id: execute_transform
            description: "Appends the validated new row to the end of the target sheet. Runs only when change_action=add_new."
            condition: "change_action == 'add_new'"

          - id: rewrite_field_mapping
            name: "Update Existing Row in Workbook"
            function_type: rewrite_excel_config_row
            row_step_id: read_field_mapping
            formula_step_id: analyse_formula
            validator_step_id: execute_transform
            force_apply: true
            description: "Writes the improved formula back to the same row. Always applies when change_action=update_existing."
            condition: "change_action == 'update_existing'"

          - id: run_control
            name: "Run Control"
            function_type: run_control
            description: "Starts the control runner for the given control_id in UAT env with yesterday's date. Config file path is passed automatically from the locate step."

          - id: poll_control_status
            name: "Wait for Control to Complete"
            function_type: poll_until
            task_step_id: run_control
            description: "Polls the control run status until it reaches a terminal state"
            poll_config:
              interval_seconds: 5
              max_attempts: 60
              done_statuses:
                - completed
                - failed
                - error
                - not_found

          - id: fetch_control_results
            name: "Fetch Control Results"
            function_type: fetch_control_results
            task_step_id: run_control
            description: "Reads the control output summary xlsx (QA/COMP breaks) and returns structured results"

          - id: summarize
            name: "Analyse & Summarise"
            function_type: llm_summarize
            description: "End-to-end summary: config change made, formula test results, control run outcome, and key findings from the results"
            prompt_template: >
              A full config update and control run workflow was executed.

              Config file resolved:
              {{locate_config_file.result}}

              Config change type: {{change_action}}
              Target sheet: {{sheet_name}}
              Formula input: {{formula_input}}

              --- ADD NEW ---
              Sheet structure detected:
              {{read_sheet_structure.result}}

              New row generated:
              {{build_new_row.result}}

              --- UPDATE EXISTING ---
              Original row read:
              {{read_field_mapping.result}}

              Improved formula config:
              {{analyse_formula.result}}

              ---
              Transform engine test results:
              {{execute_transform.result}}

              Config write result (append or rewrite):
              {{append_excel_row.result}}
              {{rewrite_field_mapping.result}}

              Control run details (control_id={{control_id}}):
              {{run_control.result}}

              Control completion status:
              {{poll_control_status.result}}

              Control results summary:
              {{fetch_control_results.result}}

              Please produce a complete end-to-end report:
              1. Config change: what was added or updated (show the row in a table), which file and sheet, which row number
              2. Formula test: before/after table, confirm it worked or flag issues
              3. Control run: control_id, env (UAT), run date, final status (completed/failed)
              4. Results summary: key findings from the control output — break down QA and COMP sections separately if present
              5. Overall verdict: did the full pipeline succeed end-to-end?
              6. Flag any step that errored or was skipped and what it means
